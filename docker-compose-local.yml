# DEBUG stack only (disposable copy for this working tree); see AGENTS.md "Local environment". Run it as
# `docker compose -p plane-dev -f docker-compose-local.yml ...` or via scripts/local/dev-*.ps1. RELEASE is project
# `plane`, driven only by scripts/local/release.ps1. Volumes have explicit plane-dev_* names, so even `-p plane`
# with this file can never mount the release data. Host ports bind 127.0.0.1 and use PLANE_DEV_* variables.
name: plane-dev

services:
  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${PLANE_DEV_REDIS_PORT:-56380}:6379"

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    hostname: plane-mq # stable RabbitMQ node name (mnesia dir) across container re-creates
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}

  plane-minio:
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    networks:
      - dev_env
    # $$MINIO_ROOT_* are expanded by sh at runtime: PID 1's long-lived argv (docker top) never holds the secret.
    entrypoint: >
      /bin/sh -c "
      mkdir -p /export/${AWS_S3_BUCKET_NAME} &&
      minio server /export --console-address ':9090' &
      sleep 5 &&
      mc alias set myminio http://localhost:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb myminio/${AWS_S3_BUCKET_NAME} -p || true
      && tail -f /dev/null
      "
    volumes:
      - uploads:/export
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:${PLANE_DEV_MINIO_PORT:-9310}:9000"
      - "127.0.0.1:${PLANE_DEV_MINIO_CONSOLE_PORT:-9391}:9090"

  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    networks:
      - dev_env
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PLANE_DEV_DB_PORT:-55433}:5432"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-api-local.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
    ports:
      - "127.0.0.1:${PLANE_DEV_API_PORT:-8310}:8000"

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    environment:
      # celery's click auto-envvar maps this to `worker --concurrency` (default would be nproc = 32 children)
      CELERY_WORKER_CONCURRENCY: "${PLANE_DEV_WORKER_CONCURRENCY:-2}"
      # debug Celery uses local settings (console email backend), never production SMTP
      DJANGO_SETTINGS_MODULE: plane.settings.local
    depends_on:
      - api
      - plane-db
      - plane-redis

  beat-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    environment:
      DJANGO_SETTINGS_MODULE: plane.settings.local
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: "no"
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-migrator.sh --settings=plane.settings.local
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis

# Explicit names: these never resolve to the release volumes (plane_*), whatever project name is used.
volumes:
  redisdata:
    name: plane-dev_redisdata
  uploads:
    name: plane-dev_uploads
  pgdata:
    name: plane-dev_pgdata
  rabbitmq_data:
    name: plane-dev_rabbitmq_data

networks:
  dev_env:
    driver: bridge
